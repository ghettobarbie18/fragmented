<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fragmented</title>

<style>

body {
    margin: 0;
    padding: 60px 0;
    background: #080000;
    font-family: Georgia, serif;
}


/* MAIN TEMPLATE */

.fragmented {
    position: relative;
    width: 650px;
    min-height: 600px;
    margin: 60px auto;
    padding: 100px 70px;
    box-sizing: border-box;
    background: linear-gradient(
        to bottom,
        ##9b000a,
        #730000,
    );

    text-align: center;

    /* POINTED TOP + BOTTOM, STRAIGHT SIDES */
    clip-path: polygon(50% 0, 84% 30%, 84% 75%, 51% 100%, 16% 75%, 16% 31%);
}


/* INNER TEXT AREA */

.content-area {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 500px;
    margin: auto;
    background-color:#390000
}

/* SCROLLING TEXT AREA */

.content {
    width: 100%;
    max-width: 450px;
    height: 250px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 20px;
    box-sizing: border-box;
    color: white;
    font-size: 14px;
    line-height: 1.7;
    text-align: justify;
}


/* SCROLLBAR */

.content::-webkit-scrollbar {
    width: 6px;
}

.content::-webkit-scrollbar-track {
    background: #160000;
}

.content::-webkit-scrollbar-thumb {
    background: #8b0000;
}

.content::-webkit-scrollbar-thumb:hover {
    background: #c00000;
}


/* TITLE */

.title {
    color: #ffb000;

    font-size: 32px;
    font-weight: bold;

    letter-spacing: 6px;
    text-transform: uppercase;

    text-shadow:
        0 0 5px #ff0000,
        0 0 12px #8b0000;

    margin-bottom: 15px;
}


/* QUOTE */

.quote {
    color: #d8c7c7;

    font-size: 14px;
    font-style: italic;

    margin-bottom: 35px;
}


/* TEXT */

.content {
    color: #e6d6d6;

    font-size: 14px;
    line-height: 1.7;

    text-align: center;
}

</style>
</head>

<body>

<div class="fragmented">

    <div class="content-area">

        <div class="title">
            FRAGMENTED
        </div>

        <div class="quote">
            Beauty born from darkness.
        </div>

        <div class="content">
            Your text goes here.

            Your character information,
            biography, plot, or other writing
            can sit inside the center of the
            template while the sides remain
            completely straight.
        </div>

    </div>

</div>

</body>
</html>
