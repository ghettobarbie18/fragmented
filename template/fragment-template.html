<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fragment Template</title>

<style>

body {
    margin: 0;
    padding: 60px 0;
    background: #080000;
    font-family: Georgia, serif;
}

/* MAIN TEMPLATE */

.fragment-template {
    position: relative;
    width: 500px;
    min-height: 500px;
    margin: 50px auto;
    padding: 30px;
    box-sizing: border-box;

    background: linear-gradient(
        to bottom,
        #ff0000,
        #fa1502,
        #f52a03
    );

    border: 5px double #4a1111;
    overflow: visible;
}


/* TRIANGLE BOX */

.triangle-gradient-box {
    position: relative;
    max-width: 400px;
    padding: 24px;
    border-radius: 12px;
    margin: 40px auto;

    border: 4px solid transparent;

    background:
        linear-gradient(
            #f03f05,
            #9b000a,
            #f03f05
        ) padding-box,

        linear-gradient(
            135deg,
            #f03f05,
            #9b000a,
            #f03f05
        ) border-box;
}


/* TOP TRIANGLE */

.triangle-gradient-box::before {
    content: "";
    position: absolute;

    left: 50%;
    top: -15px;

    transform: translateX(-50%);

    width: 24px;
    height: 12px;

    background: #9b000a;

    clip-path: polygon(
        50% 0%,
        0% 100%,
        100% 100%
    );
}


/* BOTTOM TRIANGLE */

.triangle-gradient-box::after {
    content: "";
    position: absolute;

    left: 50%;
    bottom: -15px;

    transform: translateX(-50%);

    width: 24px;
    height: 12px;

    background: #9b000a;

    clip-path: polygon(
        0% 0%,
        100% 0%,
        50% 100%
    );
}


/* TITLE */

.title {
    position: relative;

    margin-top: 10px;

    color: #390000;

    text-align: center;

    font-size: 36px;
    font-weight: bold;

    letter-spacing: 6px;

    text-transform: uppercase;

    text-shadow:
        0 0 2px #ffbd00,
        0 0 6px #eb5406,
        0 0 12px #eb5406,
        2px 2px 4px #ffbd00;
}


/* QUOTE */

.quote {
    margin-top: 2px;

    color: #390000;

    font-family: "Edu QLD Hand", cursive;

    font-size: 15px;

    letter-spacing: 2px;

    text-align: center;
}


/* TEXT */

.text {
    width: 55%;

    margin-top: 35px;

    line-height: 1.7;

    font-size: 14px;

    text-align: justify;

    color: #390000;
}


/* IMAGE */

.image {
    position: absolute;

    right: 25px;
    top: 145px;

    width: 150px;
    height: 220px;

    background-size: cover;
    background-position: center;

    border: 2px solid #4a1111;
}


/* FOOTER */

.footer-quote {
    position: absolute;

    bottom: 25px;

    left: 30px;
    right: 30px;

    padding-top: 15px;

    border-top: 1px solid #641313;

    color: #390000;

    font-size: 14px;

    letter-spacing: 4px;

    text-align: center;

    text-transform: uppercase;
}

</style>
</head>


<body>

<div class="fragment-template">

    <div class="title">
        YOUR TITLE
    </div>

    <div class="quote">
        Your quote goes here...
    </div>


    <div class="triangle-gradient-box">

        <div class="text">
            Your main text goes here.

            Add your character information,
            biography, plot, description,
            or other content here.
        </div>


        <div
            class="image"
            style="background-image: url('https://raw.githubusercontent.com/ghettobarbie18/fragmented/refs/heads/main/genocide.webp');">
        </div>

    </div>


    <div class="footer-quote">
        YOUR FOOTER QUOTE
    </div>

</div>

</body>
</html>
