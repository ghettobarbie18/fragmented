<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fragmented</title>

<style>

body {
    margin: 0;
    padding: 60px 0;
    background: #080000;
    width:580px
    height:1000px;
    font-family: Georgia, serif;
}


/* =================================
   MAIN TEMPLATE
   ================================= */

.fragmented {
    position: relative;
    width: 580px;
    height: 1000px;
    margin: 60px auto;
    box-sizing: border-box;

    /* BACKGROUND IMAGE */
    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/fragmented/refs/heads/main/dulcebg%20(1).png");
    background-size: cover;
    background-position: center;
    justify-content: center;
}


/* =================================
   CONTENT AREA
   ================================= */

.content-area {
    position: relative;
    z-index: 2;
    width: 300px;
    float:left;
    margin-left:150px;
    box-sizing: border-box;
    text-align: center;
}


/* =================================
   TITLE + QUOTE ROW
   ================================= */

.heading-row {
    display: flex;
    width: 100%;
    align-items: center;
    margin-bottom: 25px;
}


/* =================================
   TITLE — LEFT SIDE
   ================================= */

.title {
    width: 50%;
    color: #ffb000;
    font-size: 32px;
    font-weight: bold;
    margin-left:50px;
    float:left;
    margin-top:400px;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-align: left;
    transform: rotate(-90deg);
    transform-origin: center center;
    white-space: nowrap;
    text-shadow:
        0 0 5px #ff0000,
        0 0 12px #8b0000;
}


/* =================================
   QUOTE — RIGHT SIDE
   ================================= */

.quote {
    width: 50%;
    color: #d8c7c7;
    font-size: 14px;
    font-style: italic;
    text-align: right;
    float:right;
    margin-right:50px;
    margin-top:400px;
    transform: rotate(-90deg);
    padding-right: 20px;
    box-sizing: border-box;
}


/* =================================
   BODY TEXT BOX
   ================================= */

.content {
    width: 300px;
    height: 400px;
    box-sizing: border-box;
    padding: 18px 22px;
    background: rgba(57, 0, 0, 0.88);
    color: #e6d6d6;
    font-size: 14px;
    line-height: 1.7;
    float:left;
    margin-left:150px;

    /* JUSTIFIED TEXT */
    text-align: justify;

    /* SCROLLING */
    overflow-y: auto;
    overflow-x: hidden;
}


/* =================================
   SCROLLBAR
   ================================= */

.content::-webkit-scrollbar {
    width: 6px;
}

.content::-webkit-scrollbar-track {
    background: #160000;
}

.content::-webkit-scrollbar-thumb {
    background: #8b0000;
}

.content::-webkit-scrollbar-thumb:hover {
    background: #c00000;
}

</style>
</head>


<body>

<div class="fragmented">

    <div class="content-area">

        <div class="heading-row">

            <div class="title">
                FRAGMENTED
            </div>

            <div class="quote">
                Beauty born from darkness.
            </div>

        </div>


        <div class="content">

            Your text goes here.

            Your character information, biography,
            plot, or other writing can sit inside
            this separate box.

            The body text is justified and will
            automatically scroll when it reaches
            the maximum height of the box.

        </div>

    </div>

</div>

</body>
</html>
