```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fragmented</title>

<style>

body {
    margin: 0;
    padding: 60px 0;
    background: #080000;
    font-family: Georgia, serif;
}


/* =================================
   MAIN TEMPLATE
   POINTED TOP + BOTTOM
   STRAIGHT SIDES
   ================================= */

.fragmented {
    position: relative;

    width: 650px;
    height: 600px;

    margin: 60px auto;

    box-sizing: border-box;

    /* BACKGROUND IMAGE */
    background-image: url("https://raw.githubusercontent.com/ghettobarbie18/fragmented/refs/heads/main/dulcebg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    /* POINTED TOP + BOTTOM / STRAIGHT SIDES */
    clip-path: polygon(
        50% 0%,
        100% 12%,
        100% 88%,
        50% 100%,
        0% 88%,
        0% 12%
    );

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =================================
   INNER CONTENT
   ================================= */

.content-area {
    position: relative;
    z-index: 2;

    width: 480px;

    padding: 20px 35px;

    box-sizing: border-box;

    text-align: center;
}


/* =================================
   TITLE
   ================================= */

.title {
    color: #ffb000;

    font-size: 32px;
    font-weight: bold;

    letter-spacing: 6px;
    text-transform: uppercase;

    text-shadow:
        0 0 5px #ff0000,
        0 0 12px #8b0000;

    margin-bottom: 15px;
}


/* =================================
   QUOTE
   ================================= */

.quote {
    color: #d8c7c7;

    font-size: 14px;
    font-style: italic;

    margin-bottom: 20px;
}


/* =================================
   BODY TEXT BOX
   LEFT + RIGHT GRADIENT BORDERS
   ================================= */

.content {
    width: 100%;
    height: 250px;

    box-sizing: border-box;

    padding: 18px 22px;

    background: rgba(57, 0, 0, 0.88);

    /* LEFT + RIGHT ONLY */
    border-left: 4px solid;
    border-right: 4px solid;

    border-image:
        linear-gradient(
            to bottom,
            #390000,
            #8b0000,
            #ff0000,
            #ffbd00,
            #8b0000,
            #390000
        ) 1;

    color: #e6d6d6;

    font-size: 14px;

    line-height: 1.7;

    /* JUSTIFIED BODY TEXT */
    text-align: justify;

    /* SCROLLING */
    overflow-y: auto;
    overflow-x: hidden;
}


/* =================================
   SCROLLBAR
   ================================= */

.content::-webkit-scrollbar {
    width: 6px;
}

.content::-webkit-scrollbar-track {
    background: #160000;
}

.content::-webkit-scrollbar-thumb {
    background: #8b0000;
}

.content::-webkit-scrollbar-thumb:hover {
    background: #c00000;
}

</style>
</head>


<body>

<div class="fragmented">

    <div class="content-area">

        <div class="title">
            FRAGMENTED
        </div>

        <div class="quote">
            Beauty born from darkness.
        </div>

        <div class="content">

            Your text goes here.

            Your character information, biography,
            plot, or other writing can sit inside
            this separate box.

            The body text is justified and will
            automatically scroll once it reaches
            the maximum height of the box.

        </div>

    </div>

</div>

</body>
</html>
```
