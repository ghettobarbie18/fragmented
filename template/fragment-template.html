<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fragmented</title>

<style>

body {
    margin: 0;
    padding: 60px 0;
    background: #080000;
    font-family: Georgia, serif;
}


/* MAIN TEMPLATE */

.fragmented {
    position: relative;

    width: 650px;
    min-height: 600px;

    margin: 60px auto;
    padding: 100px 70px;

    box-sizing: border-box;

    background: linear-gradient(
        to bottom,
        #8b0000,
        #300000,
        #080000
    );

    text-align: center;

    /* POINTED TOP + BOTTOM, STRAIGHT SIDES */
    clip-path: polygon(
        50% 0%,
        100% 8%,
        100% 92%,
        50% 100%,
        0% 92%,
        0% 8%
    );
}


/* INNER TEXT AREA */

.content-area {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 500px;

    margin: auto;
}


/* TITLE */

.title {
    color: #ffb000;

    font-size: 32px;
    font-weight: bold;

    letter-spacing: 6px;
    text-transform: uppercase;

    text-shadow:
        0 0 5px #ff0000,
        0 0 12px #8b0000;

    margin-bottom: 15px;
}


/* QUOTE */

.quote {
    color: #d8c7c7;

    font-size: 14px;
    font-style: italic;

    margin-bottom: 35px;
}


/* TEXT */

.content {
    color: #e6d6d6;

    font-size: 14px;
    line-height: 1.7;

    text-align: center;
}

</style>
</head>

<body>

<div class="fragmented">

    <div class="content-area">

        <div class="title">
            FRAGMENTED
        </div>

        <div class="quote">
            Beauty born from darkness.
        </div>

        <div class="content">
            Your text goes here.

            Your character information,
            biography, plot, or other writing
            can sit inside the center of the
            template while the sides remain
            completely straight.
        </div>

    </div>

</div>

</body>
</html>
