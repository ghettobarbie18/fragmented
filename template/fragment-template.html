<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fragmented</title>

<style>

/* PAGE BACKGROUND */

body {
    margin: 0;
    padding: 40px 0;
    background: #080000;
    font-family: Georgia, serif;
}


/* DIAMOND TEMPLATE */

.fragmented {
    width: 650px;
    height: 650px;
    margin: 60px auto;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-sizing: border-box;
    padding: 140px;

    background: linear-gradient(
        135deg,
        #8b0000,
        #300000,
        #080000
    );

    border: 8px solid #5c0000;

    clip-path: polygon(
        50% 0%,
        100% 50%,
        50% 100%,
        0% 50%
    );

    text-align: center;
}


/* TITLE */

.title {
    color: #ffb000;

    font-size: 32px;
    font-weight: bold;

    letter-spacing: 6px;
    text-transform: uppercase;

    text-shadow:
        0 0 5px #ff0000,
        0 0 12px #8b0000;

    margin-bottom: 12px;
}


/* QUOTE */

.quote {
    color: #d8c7c7;

    font-size: 14px;
    font-style: italic;

    margin-bottom: 25px;
}


/* CENTER TEXT */

.content {
    color: #e6d6d6;

    font-size: 14px;
    line-height: 1.7;

    max-width: 300px;

    text-align: center;
}

</style>
</head>


<body>

<div class="fragmented">

    <div class="title">
        FRAGMENTED
    </div>

    <div class="quote">
        Beauty born from darkness.
    </div>

    <div class="content">
        Your text goes here.

        Your character information,
        biography, plot, or other writing
        can sit right in the center of
        the diamond.
    </div>

</div>

</body>
</html>
